# BLE observer only - continuous passive capture of every advertisement heard.
CONFIG_BT=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_DEVICE_NAME="skew_logger"
CONFIG_BT_SETTINGS=n

CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

# Long unattended captures (hours) - k_uptime_get() is 64-bit ms, no
# overflow concern at any realistic capture length.
